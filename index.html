<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>luv u jao toua lek</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      position: relative;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 1.5s ease-in-out, transform 3s ease-in-out;
      z-index: -3;
    }

    #bg1 {
      background-image: url("IMG1.jpeg");
      opacity: 1;
      transform: scale(1.05);
    }

    #bg2 {
      background-image: url("IMG2.jpeg");
      opacity: 0;
      transform: scale(1);
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: -2;
    }

    /* =========================
       MAIN CARD
    ========================= */

    .card {
      position: absolute;
      bottom: 50px; 
      left: 50%;
      transform: translateX(-50%);

      padding: 35px 45px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      
      z-index: 10; /* เลเยอร์กล่องข้อความ */
    }

    h1 {
      margin: 0 0 25px 0;
      color: #1e293b;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       PRESS ROSE BUTTON
    ========================= */

    #roseButton {
      border: none;
      padding: 14px 30px;
      border-radius: 999px;
      background: #ff6b81;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #roseButton:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    #roseButton:active {
      transform: scale(0.92);
    }

    /* =========================
       ROSE CONTAINER
    ========================= */

    #roseContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      
      /* เปลี่ยนให้ซ้อนอยู่ "ด้านหน้า" กล่องข้อความ (มากกว่า 10) */
      z-index: 20; 
      overflow: hidden;
    }

    /* =========================
       EACH ROSE
    ========================= */

    .rose {
      position: absolute;
      width: 100px;
      height: auto;
      user-select: none;
      will-change: transform;
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.25));
      transform-origin: center center;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        bottom: 40px; 
        padding: 28px 22px;
        width: 90%; 
      }
      h1 { font-size: 2rem; }
      #roseButton { padding: 12px 25px; font-size: 1rem; }
      .rose { width: 75px; }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div id="bg1" class="background"></div>
  <div id="bg2" class="background"></div>
  <div class="overlay"></div>

  <!-- MAIN CARD -->
  <div class="card">
    <h1>luv u jao toua lek</h1>
    <button id="roseButton">
      PRESS ROSE
    </button>
  </div>

  <!-- ROSES -->
  <div id="roseContainer"></div>

  <script>
    /* ==================================================
       BACKGROUND MORPH
    ================================================== */
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");
    let showingFirst = true;

    setInterval(() => {
      if (showingFirst) {
        bg1.style.opacity = "0";
        bg1.style.transform = "scale(1)";
        bg2.style.opacity = "1";
        bg2.style.transform = "scale(1.05)";
      } else {
        bg1.style.opacity = "1";
        bg1.style.transform = "scale(1.05)";
        bg2.style.opacity = "0";
        bg2.style.transform = "scale(1)";
      }
      showingFirst = !showingFirst;
    }, 3000);


    /* ==================================================
       ROSE SYSTEM (อัปเดตระบบเด้งและการชน)
    ================================================== */
    const button = document.getElementById("roseButton");
    const container = document.getElementById("roseContainer");
    const card = document.querySelector('.card'); // ดึงข้อมูลกล่องข้อความมาคำนวณ

    button.addEventListener("click", () => {
      createRose();
    });

    function createRose() {
      const rose = document.createElement("img");
      rose.src = "IMG3.png";
      rose.className = "rose";
      container.appendChild(rose);

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // 1. ขนาดของดอกกุหลาบ
      const size = 60 + Math.random() * 50;
      rose.style.width = size + "px";

      // 2. หมุนตอนเริ่ม และหมุนตอนตก
      const startRotation = -360 + Math.random() * 720;
      const finalRotation = -45 + Math.random() * 90;

      // 3. จุดเกิด (สุ่มลอยมาจากขอบจอ)
      const sides = ["left", "right", "top"];
      const side = sides[Math.floor(Math.random() * sides.length)];
      let startX, startY;

      if (side === "left") {
        startX = -size - 50;
        startY = Math.random() * screenHeight * 0.5;
      } else if (side === "right") {
        startX = screenWidth + 50;
        startY = Math.random() * screenHeight * 0.5;
      } else {
        startX = Math.random() * screenWidth;
        startY = -size - 50;
      }

      // 4. จุดตก (หลบกล่องข้อความ ให้ไปตกซ้ายหรือขวา)
      const cardRect = card.getBoundingClientRect();
      let pileX;
      
      // สุ่มว่าจะให้เด้งไปตกฝั่งซ้าย หรือ ฝั่งขวาของกล่อง
      if (Math.random() > 0.5) {
        // ตกฝั่งซ้าย (สุ่มจากขอบซ้ายสุดของจอ จนถึง ขอบซ้ายของกล่อง)
        pileX = Math.random() * (cardRect.left - (size / 2));
        // เผื่อขอบหน้าจอไม่ให้ทะลุ
        pileX = Math.max(10, Math.min(pileX, cardRect.left - size + 20));
      } else {
        // ตกฝั่งขวา (สุ่มจากขอบขวาของกล่อง จนถึง ขอบขวาสุดของจอ)
        pileX = cardRect.right - 20 + Math.random() * (screenWidth - cardRect.right);
        pileX = Math.max(cardRect.right - 20, Math.min(pileX, screenWidth - size - 10));
      }

      // 5. สุ่มความสูงของจุดตก (สูงต่ำไม่เท่ากัน กองแบบธรรมชาติขึ้น)
      const finalY = screenHeight - size - 10 - (Math.random() * 120);

      // 6. สุ่มความแรงในการเด้ง (Bounce Height)
      const bounceHeight = 30 + Math.random() * 80; // เด้งสูงตั้งแต่ 30px ถึง 110px

      // 7. ให้เด้งกระเด็นออกด้านข้างนิดหน่อยตอนตกถึงพื้น (จำลองฟิสิกส์การชน)
      const bounceTargetX = pileX + (Math.random() > 0.5 ? 25 : -25);

      // ตั้งค่าจุดเริ่มต้น
      rose.style.left = "0px";
      rose.style.top = "0px";
      rose.style.transform = `translate(${startX}px, ${startY}px) rotate(${startRotation}deg) scale(0.3)`;

      /* ================================================
         ANIMATION FLOW
      ================================================ */
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          
          // สเต็ปที่ 1: ลอยมาตกที่พื้น (หลบกล่องข้อความแล้ว)
          rose.style.transition = "transform 1.2s cubic-bezier(.15,.85,.25,1.15)";
          rose.style.transform = `translate(${pileX}px, ${finalY}px) rotate(${finalRotation}deg) scale(1)`;

          // สเต็ปที่ 2: พอตกถึงพื้น ให้เด้งขึ้น! (สูงต่ำไม่เท่ากัน)
          setTimeout(() => {
            rose.style.transition = "transform 0.3s ease-out";
            rose.style.transform = `translate(${bounceTargetX}px, ${finalY - bounceHeight}px) rotate(${finalRotation + 15}deg) scale(1.05)`;

            // สเต็ปที่ 3: ตกลงมานอนนิ่งๆ บนพื้นหลังเด้ง
            setTimeout(() => {
              rose.style.transition = "transform 0.35s ease-in";
              rose.style.transform = `translate(${bounceTargetX}px, ${finalY}px) rotate(${finalRotation}deg) scale(1)`;
            }, 300);

          }, 1200);

        });
      });
    }
  </script>

</body>
</html>
