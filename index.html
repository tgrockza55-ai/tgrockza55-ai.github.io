<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>luv u jao toua lek</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      position: relative;
    }

    /* Background images */
    .background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transition:
        opacity 1.5s ease-in-out,
        transform 3s ease-in-out;

      z-index: -2;
    }

    #bg1 {
      background-image: url("IMG1.jpeg");
      opacity: 1;
      transform: scale(1.05);
    }

    #bg2 {
      background-image: url("IMG2.jpeg");
      opacity: 0;
      transform: scale(1);
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: -1;
    }

    /* Center card */
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 40px 50px;
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      text-align: center;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.2);

      min-width: 280px;
    }

    h1 {
      margin: 0;

      color: #1e293b;

      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;

      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="bg1" class="background"></div>
  <div id="bg2" class="background"></div>

  <div class="overlay"></div>

  <div class="card">
    <h1>luv u jao toua lek</h1>
  </div>

  <script>
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");

    let showingFirst = true;

    setInterval(() => {

      if (showingFirst) {
        bg1.style.opacity = "0";
        bg1.style.transform = "scale(1)";

        bg2.style.opacity = "1";
        bg2.style.transform = "scale(1.05)";
      } else {
        bg1.style.opacity = "1";
        bg1.style.transform = "scale(1.05)";

        bg2.style.opacity = "0";
        bg2.style.transform = "scale(1)";
      }

      showingFirst = !showingFirst;

    }, 3000);
  </script>

</body>
</html>
